<!DOCTYPE html>
<html lang="en">

<title>Highway Racing 3D</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    user-select:none;
    -webkit-user-select:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#111;
    font-family:Arial,sans-serif;
}

#game{
    position:fixed;
    inset:0;
}

canvas{
    width:100%;
    height:100%;
    display:block;
}

/* ================= HUD ================= */

#hud{
    position:fixed;
    top:12px;
    left:12px;
    right:12px;
    z-index:20;

    display:flex;
    justify-content:space-between;
    align-items:center;

    pointer-events:none;
}

.hudBox{
    min-width:90px;
    padding:9px 13px;

    color:#fff;
    background:rgba(5,8,12,.78);

    border:1px solid rgba(255,255,255,.22);
    border-radius:11px;

    font-size:15px;
    font-weight:900;

    text-shadow:0 2px 3px #000;
    box-shadow:0 4px 15px rgba(0,0,0,.35);
}

/* ================= AD ================= */

#bannerAd{
    position:fixed;
    z-index:70;

    top:65px;
    left:50%;

    transform:translateX(-50%);

    width:320px;
    height:50px;

    overflow:hidden;
}

/* ================= START SCREEN ================= */

#startScreen{
    position:fixed;
    inset:0;
    z-index:100;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
      radial-gradient(
        circle at center,
        rgba(30,100,170,.45),
        rgba(0,0,0,.96)
      );
}

.startPanel{
    width:min(92%,440px);

    padding:34px 28px;

    text-align:center;

    background:
      linear-gradient(
        145deg,
        rgba(25,30,38,.97),
        rgba(5,8,12,.98)
      );

    border:1px solid rgba(255,255,255,.2);
    border-radius:25px;

    box-shadow:
      0 25px 90px #000;
}

.gameTitle{
    color:#fff;
    font-size:34px;
    font-weight:1000;
    letter-spacing:2px;

    text-shadow:
      0 3px 12px rgba(0,0,0,.8);
}

.gameSub{
    color:#aaa;
    margin-top:10px;
    margin-bottom:27px;
}

#startButton{
    width:100%;
    padding:17px;

    border:0;
    border-radius:13px;

    color:#fff;
    background:
      linear-gradient(#32c65b,#08732a);

    font-size:20px;
    font-weight:900;

    box-shadow:
      0 6px 0 #034a18,
      0 12px 30px rgba(0,0,0,.4);
}

#startButton:active{
    transform:translateY(5px);
    box-shadow:0 1px 0 #034a18;
}

/* ================= PAUSE ================= */

#pauseButton{
    position:fixed;
    top:64px;
    right:12px;

    z-index:35;

    width:48px;
    height:42px;

    color:#fff;
    background:rgba(0,0,0,.75);

    border:1px solid rgba(255,255,255,.25);

    font-weight:bold;
}

#pauseScreen{
    position:fixed;
    inset:0;
    z-index:90;

}

.pauseBox{
    padding:30px;

}

.pauseBox button{
    margin-top:20px;

    padding:12px 35px;

    border:0;
    border-radius:10px;
}

/* ================= SPEED ================= */

#speedometer{
    position:fixed;

    left:50%;
    bottom:205px;

    transform:translateX(-50%);

    z-index:30;

    width:110px;
    height:55px;

    padding-top:9px;

    border:

    border-radius:14px;

    text-align:center;

    box-shadow:
      0 5px 20px rgba(0,0,0,.5);
}

#speedNumber{
    font-size:24px;
    font-weight:1000;
}

#speedText{
    font-size:9px;
    color:#aaa;
}

/* ================= NITRO ================= */

#nitroBox{
    position:fixed;

    left:15px;
    bottom:210px;

    z-index:30;

    width:160px;
    height:15px;

    border:2px solid #fff;
    border-radius:12px;

    overflow:hidden;

    background:#111;
}

#nitroFill{
    width:100%;
    height:100%;

    background:
      linear-gradient(
        90deg,
        #008cff,
        #53d8ff

}

/* ================= CONTROLS ================= */

#controls{
    position:fixed;

    left:0;
    right:0;
    bottom:8px;

    height:190px;

    z-index:40;

    pointer-events:none;
}

.control{
    position:absolute;

    min-width:78px;
    min-height:58px;

    color:#fff;

    border:
      1px solid rgba(255,255,255,.3);

    border-radius:13px;

    background:
      linear-gradient(
        #59636c,
        #11171b
      );

    box-shadow:
      inset 0 2px rgba(255,255,255,.2),
      inset 0 -5px rgba(0,0,0,.55),
      0 5px 14px rgba(0,0,0,.55);

    font-weight:1000;
    font-size:15px;

    pointer-events:auto;

    touch-action:none;
}

.control:active,
.control.active{
    transform:translateY(4px);

    box-shadow:
      inset 0 4px rgba(0,0,0,.5),
      0 2px 5px #000;
}

#leftButton{
    left:15px;
    bottom:73px;

    font-size:30px;
}

#rightButton{
    left:103px;
    bottom:73px;

    font-size:30px;
}

#goButton{
    right:104px;
    bottom:78px;
}

#brakeButton{
    right:12px;

}

#nitroButton{
    right:104px;
    bottom:10px;

    background:
      linear-gradient(
        #087fca,
        #07384f
      );
}

#reverseButton{
    right:12px;
    bottom:10px;
}

/* ================= MOBILE ================= */

@media(max-width:600px){

    .gameTitle{
        font-size:27px;
    }

    .startPanel{
        padding:27px 22px;
    }

    #bannerAd{
        top:105px;
    }

    #speedometer{
        bottom:205px;
    }

    #nitroBox{
        bottom:202px;
    }
}
</style>
</head>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";


/* =========================================================
   VARIABLES
========================================================= */

let scene;
let camera;
let renderer;

let player;

let trafficCars=[];
let coins=[];
let roadSegments=[];
let roadLines=[];
let trees=[];
let streetLights=[];

let gameStarted=false;
let paused=false;

let speed=0;
let maxSpeed=13;

let distance=0;
let coinCount=0;
let level=1;

let nitro=100;

let steering=0;
let targetX=0;

let roadOffset=0;


/* =========================================================
   INPUT
========================================================= */

const input={

    left:false,
    right:false,
    go:false,
    brake:false,
    reverse:false,
    nitro:false

};


/* =========================================================
   SCENE
========================================================= */

scene=new THREE.Scene();

scene.background=
    new THREE.Color(0x78b5e8);

scene.fog=
    new THREE.Fog(
        0x78b5e8,
        75,
        430
    );


/* =========================================================
   CAMERA
========================================================= */

camera=
    new THREE.PerspectiveCamera(
        65,
        innerWidth/innerHeight,
        .1,
        1000
    );

camera.position.set(
    0,
    5.2,
    10
);


/* =========================================================
   RENDERER
========================================================= */

renderer=
    new THREE.WebGLRenderer({
        antialias:true,
        powerPreference:"high-performance"
    });

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.shadowMap.enabled=true;

renderer.shadowMap.type=
    THREE.PCFSoftShadowMap;

document
    .getElementById("game")
    .appendChild(renderer.domElement);


/* =========================================================
   LIGHTING
========================================================= */

const sun=
    new THREE.DirectionalLight(
        0xffffff,
        3
    );

sun.position.set(
    -80,
    120,
    80
);

sun.castShadow=true;

sun.shadow.mapSize.width=2048;
sun.shadow.mapSize.height=2048;

scene.add(sun);


const ambient=
    new THREE.HemisphereLight(
        0xdceeff,
        0x314c31,
        1.8
    );

scene.add(ambient);


/* =========================================================
   GROUND
========================================================= */

const ground=
    new THREE.Mesh(
        new THREE.PlaneGeometry(
            1500,
            1500
        ),
        new THREE.MeshStandardMaterial({
            color:0x376f3b,
            roughness:1
        })
    );

ground.rotation.x=
    -Math.PI/2;

ground.position.y=-.12;

scene.add(ground);


/* =========================================================
   ROAD
========================================================= */

const roadLength=1000;

const road=
    new THREE.Mesh(
        new THREE.PlaneGeometry(
            15,
            roadLength
        ),
        new THREE.MeshStandardMaterial({
            color:0x292929,
            roughness:.9
        })
    );

road.rotation.x=
    -Math.PI/2;

road.position.z=
    -470;

scene.add(road);


/* =========================================================
   ROAD SHOULDERS
========================================================= */

function createShoulder(x){

    const shoulder=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .18,
                .08,
                roadLength
            ),
            new THREE.MeshStandardMaterial({
                color:0xf2f2f2
            })
        );

    shoulder.position.set(
        x,
        .04,
        -470
    );

    scene.add(shoulder);
}

createShoulder(-7.5);
createShoulder(7.5);


/* =========================================================
   ROAD CENTER / LANE LINES
========================================================= */

for(
    let z=-520;
    z<40;
    z+=11
){

    const line=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .13,
                .045,
                5
            ),
            new THREE.MeshStandardMaterial({
                color:0xffffff
            })
        );

    line.position.set(
        0,
        .045,
        z
    );

    scene.add(line);

    roadLines.push(line);
}


/* =========================================================
   ROAD EDGE DASHES
========================================================= */

for(
    let z=-520;
    z<40;
    z+=15
){

    for(
        const x of [-7.5,7.5]
    ){

        const edge=
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    .12,
                    .045,
                    6
                ),
                new THREE.MeshStandardMaterial({
                    color:0xffffff
                })
            );

        edge.position.set(
            x,
            .045,
            z
        );

        scene.add(edge);

        roadSegments.push(edge);
    }
}


/* =========================================================
   CAR CREATOR
========================================================= */

function createCar(color){

    const car=
        new THREE.Group();


    /* MAIN BODY */

    const body=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                2.25,
                .65,
                4.25
            ),
            new THREE.MeshStandardMaterial({
                color:color,
                metalness:.55,
                roughness:.25
            })
        );

    body.position.y=.72;

    body.castShadow=true;

    car.add(body);


    /* FRONT HOOD */

    const hood=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                2.05,
                .22,
                1.25
            ),
            new THREE.MeshStandardMaterial({
                color:color,
                metalness:.55,
                roughness:.23
            })
        );

    hood.position.set(
        0,
        1.04,
        -1.38
    );

    car.add(hood);


    /* CABIN */

    const cabin=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                1.58,
                .72,
                1.8
            ),
            new THREE.MeshStandardMaterial({
                color:0x17222b,
                metalness:.65,
                roughness:.08
            })
        );

    cabin.position.set(
        0,
        1.24,
        .05
    );

    cabin.castShadow=true;

    car.add(cabin);


    /* WINDSHIELD */

    const windshield=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                1.43,
                .43,
                .05
            ),
            new THREE.MeshStandardMaterial({
                color:0x07131c,
                metalness:.8,
                roughness:.05
            })
        );

    windshield.position.set(
        0,
        1.29,
        -.86
    );

    windshield.rotation.x=
        -0.18;

    car.add(windshield);


    /* WHEELS */

    const wheelMaterial=
        new THREE.MeshStandardMaterial({
            color:0x090909,
            roughness:.8
        });


    const wheelPositions=[
        [-1.15,.42,-1.38],
        [1.15,.42,-1.38],
        [-1.15,.42,1.38],
        [1.15,.42,1.38]
    ];


    for(
        const position
        of wheelPositions
    ){

        const wheel=
            new THREE.Mesh(
                new THREE.CylinderGeometry(
                    .43,
                    .43,
                    .34,
                    24
                ),
                wheelMaterial
            );

        wheel.rotation.z=
            Math.PI/2;

        wheel.position.set(
            position[0],
            position[1],
            position[2]
        );

        wheel.castShadow=true;

        car.add(wheel);
    }


    /* HEADLIGHTS */

    const headMaterial=
        new THREE.MeshStandardMaterial({
            color:0xffffd0,
            emissive:0xffff88,
            emissiveIntensity:2
        });


    for(
        const x of [-.67,.67]
    ){

        const light=
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    .38,
                    .18,
                    .08
                ),
                headMaterial
            );

        light.position.set(
            x,
            .83,
            -2.14
        );

        car.add(light);
    }


    /* TAIL LIGHTS */

    const tailMaterial=
        new THREE.MeshStandardMaterial({
            color:0xff1111,
            emissive:0xff0000,
            emissiveIntensity:1.8
        });


    for(
        const x of [-.67,.67]
    ){

        const light=
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    .4,
                    .18,
                    .08
                ),
                tailMaterial
            );

        light.position.set(
            x,
            .83,
            2.14
        );

        car.add(light);
    }


    return car;
}


/* =========================================================
   PLAYER CAR
========================================================= */

player=
    createCar(
        0xd71929
    );

player.position.set(
    0,
    0,
    5
);

scene.add(player);


/* =========================================================
   TRAFFIC
========================================================= */

const trafficColors=[
    0x1976d2,
    0xffffff,
    0xffc107,
    0x8e44ad,
    0x111111,
    0x16a05d,
    0xff6f00,
    0xc0392b
];


function spawnTraffic(
    z,
    lane,
    colorIndex
){

    const car=
        createCar(
            trafficColors[
                colorIndex %
                trafficColors.length
            ]
        );

    const laneX=[
        -4.8,
        0,
        4.8
    ];

    car.position.set(
        laneX[lane],
        0,
        z
    );

    const scale=
        .86+
        Math.random()*.12;

    car.scale.set(
        scale,
        scale,
        scale
    );

    car.userData.lane=lane;

    car.userData.speed=
        .65+
        Math.random()*.8;

    scene.add(car);

    trafficCars.push(car);
}


/* IMPORTANT:
   traffic is visible from the beginning
*/

spawnTraffic(-35,0,0);
spawnTraffic(-62,-1+1,1);
spawnTraffic(-88,2,2);
spawnTraffic(-120,0,3);
spawnTraffic(-155,-1+1,4);
spawnTraffic(-190,2,5);
spawnTraffic(-230,0,6);
spawnTraffic(-275,2,7);
spawnTraffic(-320,1,1);
spawnTraffic(-365,0,2);
spawnTraffic(-410,2,3);
spawnTraffic(-455,1,4);


/* =========================================================
   COINS
========================================================= */

function spawnCoin(
    z,
    lane
){

    const coin=
        new THREE.Mesh(
            new THREE.TorusGeometry(
                .43,
                .13,
                14,
                28
            ),
            new THREE.MeshStandardMaterial({
                color:0xffd21c,
                metalness:.9,
                roughness:.12,
                emissive:0x5a3600
            })
        );

    const laneX=[
        -4.8,
        0,
        4.8
    ];

    coin.position.set(
        laneX[lane],
        1.05,
        z
    );

    scene.add(coin);

    coins.push(coin);
}


for(
    let i=0;
    i<30;
    i++
){

    spawnCoin(
        -30-i*20,
        i%3
    );
}


/* =========================================================
   TREE
========================================================= */

function createTree(
    x,
    z
){

    const tree=
        new THREE.Group();


    const trunk=
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .23,
                .34,
                2.5,
                10
            ),
            new THREE.MeshStandardMaterial({
                color:0x71451f
            })
        );

    trunk.position.y=1.25;

    tree.add(trunk);


    const crown=
        new THREE.Mesh(
            new THREE.SphereGeometry(
                1.45,
                16,
                16
            ),
            new THREE.MeshStandardMaterial({
                color:0x1f7830
            })
        );

    crown.position.y=3;

    tree.add(crown);


    tree.position.set(
        x,
        0,
        z
    );

    scene.add(tree);

    trees.push(tree);
}


/* create lots of trees */

for(
    let i=0;
    i<55;
    i++
){

    const z=
        -20-
        i*11;

    createTree(
        -12-Math.random()*5,
        z
    );

    createTree(
        12+Math.random()*5,
        z-5
    );
}


/* =========================================================
   STREET LIGHTS
========================================================= */

function createStreetLight(
    x,
    z
){

    const group=
        new THREE.Group();


    const pole=
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .08,
                .1,
                5,
                10
            ),
            new THREE.MeshStandardMaterial({
                color:0x555b61,
                metalness:.6
            })
        );

    pole.position.y=2.5;

    group.add(pole);


    const lamp=
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .2,
                12,
                12
            ),
            new THREE.MeshStandardMaterial({
                color:0xffffdd,
                emissive:0xffff99,
                emissiveIntensity:2
            })
        );

    lamp.position.set(
        0,
        5,
        0
    );

    group.add(lamp);


    group.position.set(
        x,
        0,
        z
    );

    scene.add(group);

    streetLights.push(group);
}


for(
    let i=0;
    i<25;
    i++
){

    createStreetLight(
        -9.5,
        -35-i*25
    );

    createStreetLight(
        9.5,
        -47-i*25
    );
}


/* =========================================================
   CONTROLS
========================================================= */

function bindButton(
    id,
    property
){

    const button=
        document.getElementById(id);


    const down=(event)=>{

        event.preventDefault();

        input[property]=true;

        button.classList.add(
            "active"
        );
    };


    const up=(event)=>{

        event.preventDefault();

        input[property]=false;

        button.classList.remove(
            "active"
        );
    };


    button.addEventListener(
        "pointerdown",
        down
    );

    button.addEventListener(
        "pointerup",
        up
    );

    button.addEventListener(
        "pointercancel",
        up
    );

    button.addEventListener(
        "pointerleave",
        up
    );
}

/* =========================================================
   KEYBOARD
========================================================= */

window.addEventListener(
    "keydown",
    event=>{

        const key=
            event.key.toLowerCase();


        if(
            key==="a" ||
            event.key==="ArrowLeft"
        )
            input.left=true;


        if(
            key==="d" ||
            event.key==="ArrowRight"
        )
            input.right=true;


        if(
            key==="w" ||
            event.key==="ArrowUp"
        )
            input.go=true;


        if(
            key==="s" ||
            event.key==="ArrowDown"
        )
            input.brake=true;


        if(key==="r")
            input.reverse=true;


        if(event.code==="Space")
            input.nitro=true;

    }
);


window.addEventListener(
    "keyup",
    event=>{

        const key=
            event.key.toLowerCase();


        if(
            key==="a" ||
            event.key==="ArrowLeft"
        )
            input.left=false;


        if(
            key==="d" ||
            event.key==="ArrowRight"
        )
            input.right=false;


        if(
            key==="w" ||
            event.key==="ArrowUp"
        )
            input.go=false;


        if(
            key==="s" ||
            event.key==="ArrowDown"
        )
            input.brake=false;


        if(key==="r")
            input.reverse=false;


        if(event.code==="Space")
            input.nitro=false;

    }
);

/* =========================================================
   COLLISION
========================================================= */

function checkCollisions(){

    const playerBox=
        new THREE.Box3()
        .setFromObject(player);


    /* traffic collision */

    for(
        const car
        of trafficCars
    ){

        const carBox=
            new THREE.Box3()
            .setFromObject(car);


        if(
            playerBox.intersectsBox(
                carBox
            )
        ){

            speed*=.32;

            car.position.z-=18;

            player.rotation.y+=
                (Math.random()-.5)*.12;

            targetX=
                player.position.x+
                (Math.random()-.5)*1.2;

        }

    }


    /* coins */

    for(
        const coin
        of coins
    ){

        if(
            coin.position.z>20
        )
            continue;


        const coinBox=
            new THREE.Box3()
            .setFromObject(coin);


        if(
            playerBox.intersectsBox(
                coinBox
            )
        ){

            coinCount++;

            coin.position.z=-1000;

            document
            .getElementById("coins")
            .textContent=
            coinCount;

        }

    }

}


/* =========================================================
   UPDATE CAR
========================================================= */

function updatePlayer(){

    /* acceleration */

    if(input.go){

        speed+=.22;

    }else{

        speed-=.035;

    }


    /* brake */

    if(input.brake){

        speed-=.45;

    }


    /* reverse */

    if(input.reverse){

        speed-=.15;

    }


    /* nitro */

    if(
        input.nitro &&
        nitro>0 &&
        speed>0
    ){

        speed+=.55;

        nitro-=.75;

    }else{

        nitro+=.11;

    }


    nitro=
        THREE.MathUtils.clamp(
            nitro,
            0,
            100
        );


    /* maximum */

    maxSpeed=
        12+
        level*.12;


    speed=
        THREE.MathUtils.clamp(
            speed,
            -3,
            maxSpeed
        );


    /* steering */

    if(input.left){

        targetX-=
            .17+
            Math.abs(speed)*.006;

    }


    if(input.right){

        targetX+=
            .17+
            Math.abs(speed)*.006;

    }


    targetX=
        THREE.MathUtils.clamp(
            targetX,
            -5.2,
            5.2
        );


    /* actual visible car movement */

    player.position.x=
        THREE.MathUtils.lerp(
            player.position.x,
            targetX,
            .17
        );


    /* steering animation */

    steering=
        THREE.MathUtils.lerp(
            steering,
            input.left?1:
            input.right?-1:0,
            .15
        );


    player.rotation.z=
        -steering*.075;


    player.rotation.y=
        -steering*.035;

}


/* =========================================================
   MOVE WORLD
========================================================= */

function moveWorld(){

    /*
      This makes the road,
      traffic and scenery move
      toward the player.
    */

    const worldSpeed=
        speed*.72;


    /* road lines */

    for(
        const line
        of roadLines
    ){

        line.position.z+=
            worldSpeed;

        if(
            line.position.z>30
        ){

            line.position.z-=550;

        }

    }


    /* road edge */

    for(
        const edge
        of roadSegments
    ){

        edge.position.z+=
            worldSpeed;

        if(
            edge.position.z>30
        ){

            edge.position.z-=550;

        }

    }


    /* traffic */

    for(
        const car
        of trafficCars
    ){

        /*
          Different traffic
          speed gives overtaking.
        */

        const trafficMovement=
            worldSpeed*
            car.userData.speed;

        car.position.z+=
            trafficMovement;


        /* traffic recycle */

        if(
            car.position.z>35
        ){

            const lane=
                Math.floor(
                    Math.random()*3
                );

            const laneX=[
                -4.8,
                0,
                4.8
            ];

            car.position.x=
                laneX[lane];

            car.position.z=
                -260-
                Math.random()*280;

            car.userData.speed=
                .65+
                Math.random()*.8;

        }

    }


    /* coins */

    for(
        const coin
        of coins
    ){

        coin.position.z+=
            worldSpeed;

        coin.rotation.y+=
            .08;

        coin.rotation.x+=
            .025;


        if(
            coin.position.z>30
        ){

            const lane=
                Math.floor(
                    Math.random()*3
                );

            coin.position.x=[
                -4.8,
                0,
                4.8
            ][lane];

            coin.position.z=
                -200-
                Math.random()*350;

        }

    }


    /* trees */

    for(
        const tree
        of trees
    ){

        tree.position.z+=
            worldSpeed;

        if(
            tree.position.z>35
        ){

            tree.position.z-=
                620;

        }

    }


    /* lights */

    for(
        const light
        of streetLights
    ){

        light.position.z+=
            worldSpeed;

        if(
            light.position.z>35
        ){

            light.position.z-=620;

        }

    }

}


/* =========================================================
   CAMERA
========================================================= */

function updateCamera(){

    /*
      Camera follows steering.
      This makes the movement
      visually obvious.
    */

    const cameraX=
        player.position.x*.58;


    camera.position.x=
        THREE.MathUtils.lerp(
            camera.position.x,
            cameraX,
            .09
        );


    camera.position.y=
        5+
        Math.min(
            speed*.045,
            .65
        );


    camera.position.z=
        10+
        Math.min(
            speed*.03,
            .45
        );


    camera.lookAt(
        player.position.x,
        1.0,
        -18
    );

}


/* =========================================================
   HUD
========================================================= */

function updateHUD(){

    document
    .getElementById("speedNumber")
    .textContent=
        Math.round(
            Math.max(
                0,
                speed*16
            )
        );


    document
    .getElementById("nitroFill")
    .style.width=
        nitro+"%";


    document
    .getElementById("distance")
    .textContent=
        Math.floor(
            distance
        );


    level=
        Math.min(
            60,
            1+
            Math.floor(
                distance/500
            )
        );


    document
    .getElementById("level")
    .textContent=
        level;

}


/* =========================================================
   MAIN UPDATE
========================================================= */

function update(){

    if(
        !gameStarted ||
        paused
    )
        return;


    updatePlayer();

    moveWorld();

    updateCamera();

    checkCollisions();


    if(speed>0){

        distance+=
            speed*.075;

    }


    updateHUD();

}


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect=
            innerWidth/
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );

    }
);


/* =========================================================
   ANIMATION LOOP
========================================================= */

function animate(){

    requestAnimationFrame(
        animate
    );


    update();


    renderer.render(
        scene,
        camera
    );

}


animate();

</script>
