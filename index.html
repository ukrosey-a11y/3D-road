<style>
*{

html,body{

#startBtn{

/* PAUSE */

}

#pauseScreen{
    position:fixed;

}

.pauseBox{
    background:#111820;
    color:#fff;
    padding:30px;

}

.pauseBox button{
    margin-top:18px;

/* CONTROLS */

#controls{
    position:fixed;
    left:0;
    right:0;
    bottom:10px;

    pointer-events:none;
}

.btn{
    position:absolute;
    min-width:72px;
    min-height:58px;
    border-radius:14px;

    color:#fff;
    font-weight:900;
    background:
      linear-gradient(#59636c,#161b20);
    box-shadow:
      inset 0 2px rgba(255,255,255,.2),
      inset 0 -5px rgba(0,0,0,.5),
      0 5px 12px rgba(0,0,0,.5);
    pointer-events:auto;
    touch-action:none;
}

.btn:active,
.btn.active{
    transform:translateY(4px);
    box-shadow:
      inset 0 3px rgba(0,0,0,.5),
      0 2px 5px #000;
}

#left{
    left:15px;
    bottom:72px;
    font-size:28px;
}

#right{
    left:94px;
    bottom:72px;
    font-size:28px;
}

#go{
    right:105px;

}

#brake{
    right:12px;

}

#nitro{

}

/* NITRO BAR */

#nitroBar{
    position:fixed;

    z-index:30;

    border:1px solid #fff;
    border-radius:10px;
    overflow:hidden;
    background:#111;
}

#nitroFill{
    width:100%;
    height:100%;

}

/* MOBILE */

@media(max-width:600px){

    .title{
        font-size:27px;
    }

    .panel{
        padding:24px;
    }

    #bannerAd{

    }

    }

</style>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";


/* =========================================
   GAME
========================================= */

let scene;
let camera;
let renderer;

let player;

let traffic=[];

let coins=[];

let roadLines=[];

let scenery=[];

let running=false;
let paused=false;

let speed=0;
let distance=0;
let coinCount=0;
let level=1;

let nitroPower=100;

let targetX=0;

const keys={
    left:false,
    right:false,
    go:false,
    brake:false,
    reverse:false,
    nitro:false
};


/* =========================================
   SCENE
========================================= */

scene=new THREE.Scene();

scene.background=new THREE.Color(0x74a9df);

scene.fog=new THREE.Fog(
    0x74a9df,
    60,
    380
);


/* =========================================
   CAMERA
========================================= */

camera=new THREE.PerspectiveCamera(
    65,
    innerWidth/innerHeight,
    .1,
    1000
);

camera.position.set(
    0,
    4.2,
    9
);


/* =========================================
   RENDERER
========================================= */

renderer=new THREE.WebGLRenderer({
    antialias:true
});

renderer.setPixelRatio(
    Math.min(devicePixelRatio,2)
);

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.shadowMap.enabled=true;

document
.getElementById("game")
.appendChild(renderer.domElement);


/* =========================================
   LIGHT
========================================= */

const sun=new THREE.DirectionalLight(
    0xffffff,
    2.7
);

sun.position.set(
    -60,
    100,
    70
);

sun.castShadow=true;

scene.add(sun);


const ambient=new THREE.HemisphereLight(
    0xffffff,
    0x455545,
    1.5
);

scene.add(ambient);


/* =========================================
   GROUND
========================================= */

const ground=new THREE.Mesh(
    new THREE.PlaneGeometry(1000,1000),
    new THREE.MeshStandardMaterial({
        color:0x356b36
    })
);

ground.rotation.x=-Math.PI/2;

ground.position.y=-.1;

scene.add(ground);


/* =========================================
   ROAD
========================================= */

const road=new THREE.Mesh(
    new THREE.PlaneGeometry(14,1000),
    new THREE.MeshStandardMaterial({
        color:0x292929,
        roughness:.9
    })
);

road.rotation.x=-Math.PI/2;

road.position.z=-450;

scene.add(road);


/* =========================================
   ROAD EDGE
========================================= */

for(
    const x of [-7,7]
){

    const edge=new THREE.Mesh(
        new THREE.BoxGeometry(
            .18,
            .05,
            1000
        ),
        new THREE.MeshStandardMaterial({
            color:0xffffff
        })
    );

    edge.position.set(
        x,
        .03,
        -450
    );

    scene.add(edge);
}


/* =========================================
   ROAD DASHES
========================================= */

for(
    let z=-500;
    z<30;
    z+=10
){

    const dash=new THREE.Mesh(
        new THREE.BoxGeometry(
            .16,
            .035,
            5
        ),
        new THREE.MeshStandardMaterial({
            color:0xffffff
        })
    );

    dash.position.set(
        0,
        .03,
        z
    );

    scene.add(dash);

    roadLines.push(dash);
}


/* =========================================
   CAR FUNCTION
========================================= */

function makeCar(color){

    const car=new THREE.Group();


    /* BODY */

    const body=new THREE.Mesh(
        new THREE.BoxGeometry(
            2.15,
            .65,
            4.1
        ),
        new THREE.MeshStandardMaterial({
            color:color,
            metalness:.45,
            roughness:.28
        })
    );

    body.position.y=.75;

    body.castShadow=true;

    car.add(body);


    /* HOOD */

    const hood=new THREE.Mesh(
        new THREE.BoxGeometry(
            1.95,
            .22,
            1.25
        ),
        new THREE.MeshStandardMaterial({
            color:color,
            metalness:.4
        })
    );

    hood.position.set(
        0,
        1.04,
        -1.3
    );

    car.add(hood);


    /* CABIN */

    const cabin=new THREE.Mesh(
        new THREE.BoxGeometry(
            1.55,
            .7,
            1.75
        ),
        new THREE.MeshStandardMaterial({
            color:0x172530,
            metalness:.5,
            roughness:.12
        })
    );

    cabin.position.set(
        0,
        1.25,
        .1
    );

    cabin.castShadow=true;

    car.add(cabin);


    /* WHEELS */

    const wheelMat=new THREE.MeshStandardMaterial({
        color:0x101010
    });

    const wheelPositions=[
        [-1.08,.43,-1.35],
        [1.08,.43,-1.35],
        [-1.08,.43,1.35],
        [1.08,.43,1.35]
    ];

    for(const p of wheelPositions){

        const wheel=new THREE.Mesh(
            new THREE.CylinderGeometry(
                .43,
                .43,
                .32,
                24
            ),
            wheelMat
        );

        wheel.rotation.z=Math.PI/2;

        wheel.position.set(
            p[0],
            p[1],
            p[2]
        );

        wheel.castShadow=true;

        car.add(wheel);
    }


    /* HEADLIGHTS */

    const lampMat=new THREE.MeshStandardMaterial({
        color:0xffffd0,
        emissive:0xffff88,
        emissiveIntensity:2
    });

    for(const x of [-.62,.62]){

        const lamp=new THREE.Mesh(
            new THREE.BoxGeometry(
                .38,
                .18,
                .08
            ),
            lampMat
        );

        lamp.position.set(
            x,
            .82,
            -2.06
        );

        car.add(lamp);
    }


    /* TAIL LIGHTS */

    const redMat=new THREE.MeshStandardMaterial({
        color:0xff1111,
        emissive:0xff0000,
        emissiveIntensity:1
    });

    for(const x of [-.62,.62]){

        const lamp=new THREE.Mesh(
            new THREE.BoxGeometry(
                .38,
                .18,
                .08
            ),
            redMat
        );

        lamp.position.set(
            x,
            .82,
            2.06
        );

        car.add(lamp);
    }


    return car;
}


/* =========================================
   PLAYER
========================================= */

player=makeCar(0xe21d2d);

player.position.set(
    0,
    0,
    4
);

scene.add(player);


/* =========================================
   TRAFFIC
========================================= */

function addTraffic(){

    const colors=[
        0x1677d2,
        0xffffff,
        0xffc107,
        0x7d35c7,
        0x222222,
        0x15a55a,
        0xff6b21
    ];

    const car=makeCar(
        colors[
            Math.floor(
                Math.random()*colors.length
            )
        ]
    );

    const lanes=[
        -4.2,
        0,
        4.2
    ];

    car.position.x=
        lanes[
            Math.floor(
                Math.random()*3
            )
        ];

    car.position.z=
        -100-Math.random()*400;

    const scale=.82+
        Math.random()*.15;

    car.scale.set(
        scale,
        scale,
        scale
    );

    scene.add(car);

    traffic.push(car);
}


/* =========================================
   COINS
========================================= */

function addCoin(){

    const coin=new THREE.Mesh(
        new THREE.TorusGeometry(
            .4,
            .12,
            12,
            24
        ),
        new THREE.MeshStandardMaterial({
            color:0xffd21c,
            metalness:.8,
            roughness:.15,
            emissive:0x442900
        })
    );

    const lanes=[
        -4.2,
        0,
        4.2
    ];

    coin.position.x=
        lanes[
            Math.floor(
                Math.random()*3
            )
        ];

    coin.position.y=1;

    coin.position.z=
        -80-Math.random()*450;

    scene.add(coin);

    coins.push(coin);
}


/* =========================================
   TREES
========================================= */

function addTree(x,z){

    const tree=new THREE.Group();

    const trunk=new THREE.Mesh(
        new THREE.CylinderGeometry(
            .22,
            .32,
            2.2,
            10
        ),
        new THREE.MeshStandardMaterial({
            color:0x71451f
        })
    );

    trunk.position.y=1.1;

    tree.add(trunk);


    const top=new THREE.Mesh(
        new THREE.SphereGeometry(
            1.35,
            14,
            14
        ),
        new THREE.MeshStandardMaterial({
            color:0x22752e
        })
    );

    top.position.y=2.8;

    tree.add(top);

    tree.position.set(
        x,
        0,
        z
    );

    scene.add(tree);

    scenery.push(tree);
}


for(
    let z=-500;
    z<50;
    z+=18
){

    addTree(
        -12-Math.random()*4,
        z
    );

    addTree(
        12+Math.random()*4,
        z-8
    );
}


/* =========================================
   INITIAL TRAFFIC
========================================= */

for(
    let i=0;
    i<12;
    i++
){

    addTraffic();
}


/* =========================================
   INITIAL COINS
========================================= */

for(
    let i=0;
    i<25;
    i++
){

    addCoin();
}


/* =========================================
   CONTROLS
========================================= */

function bind(id,key){

    const button=
        document.getElementById(id);


    function down(e){

        e.preventDefault();

        keys[key]=true;

        button.classList.add(
            "active"
        );
    }


    function up(e){

        e.preventDefault();

        keys[key]=false;

        button.classList.remove(
            "active"
        );
    }


    button.addEventListener(
        "pointerdown",
        down
    );

    button.addEventListener(
        "pointerup",
        up
    );

    button.addEventListener(
        "pointercancel",
        up
    );

    button.addEventListener(
        "pointerleave",
        up
    );
}


bind("left","left");
bind("right","right");
bind("go","go");
bind("brake","brake");
bind("nitro","nitro");
bind("reverse","reverse");


/* =========================================
   KEYBOARD
========================================= */

window.addEventListener(
    "keydown",
    e=>{

        if(e.key==="ArrowLeft" ||
           e.key.toLowerCase()==="a")
            keys.left=true;

        if(e.key==="ArrowRight" ||
           e.key.toLowerCase()==="d")
            keys.right=true;

        if(e.key==="ArrowUp" ||
           e.key.toLowerCase()==="w")
            keys.go=true;

        if(e.key==="ArrowDown" ||
           e.key.toLowerCase()==="s")
            keys.brake=true;

        if(e.key.toLowerCase()==="r")
            keys.reverse=true;

        if(e.code==="Space")
            keys.nitro=true;
    }
);


window.addEventListener(
    "keyup",
    e=>{

        if(e.key==="ArrowLeft" ||
           e.key.toLowerCase()==="a")
            keys.left=false;

        if(e.key==="ArrowRight" ||
           e.key.toLowerCase()==="d")
            keys.right=false;

        if(e.key==="ArrowUp" ||
           e.key.toLowerCase()==="w")
            keys.go=false;

        if(e.key==="ArrowDown" ||
           e.key.toLowerCase()==="s")
            keys.brake=false;

        if(e.key.toLowerCase()==="r")
            keys.reverse=false;

        if(e.code==="Space")
            keys.nitro=false;
    }
);


/* =========================================
   COLLISION
========================================= */

function collision(){

    const playerBox=
        new THREE.Box3()
        .setFromObject(player);


    for(const car of traffic){

        const box=
            new THREE.Box3()
            .setFromObject(car);


        if(
            playerBox.intersectsBox(box)
        ){

            speed*=.35;

            car.position.z-=25;

            /* small crash movement */

            player.rotation.z=
                (Math.random()-.5)*.12;
        }
    }


    for(const coin of coins){

        if(
            coin.position.z>10 ||
            coin.position.z<-1000
        )
            continue;


        const box=
            new THREE.Box3()
            .setFromObject(coin);


        if(
            playerBox.intersectsBox(box)
        ){

            coinCount++;

            document
            .getElementById("coins")
            .textContent=
            coinCount;

            coin.position.z=-1000;
        }
    }
}


/* =========================================
   UPDATE
========================================= */

function update(){

    if(!running || paused)
        return;


    /* ACCELERATION */

    if(keys.go){

        speed+=.20;

    }else{

        speed-=.035;
    }


    /* BRAKE */

    if(keys.brake){

        speed-=.38;
    }


    /* REVERSE */

    if(keys.reverse){

        speed-=.14;
    }


    /* NITRO */

    if(
        keys.nitro &&
        nitroPower>0 &&
        speed>0
    ){

        speed+=.55;

        nitroPower-=.9;

    }else{

        nitroPower+=.12;
    }


    nitroPower=
        Math.max(
            0,
            Math.min(
                100,
                nitroPower
            )
        );


    /* SPEED */

    const maximum=
        8.5+(level*.12);

    speed=
        Math.max(
            -2.5,
            Math.min(
                maximum,
                speed
            )
        );


    /* STEERING */

    if(keys.left)
        targetX-=.11;

    if(keys.right)
        targetX+=.11;


    targetX=
        Math.max(
            -4.3,
            Math.min(
                4.3,
                targetX
            )
        );


    player.position.x+=
        (targetX-player.position.x)
        *.16;


    /* CAR TILT */

    let steer=0;

    if(keys.left)
        steer=1;

    if(keys.right)
        steer=-1;

    player.rotation.z=
        THREE.MathUtils.lerp(
            player.rotation.z,
            steer*.08,
            .12
        );


    /* WORLD MOVEMENT */

    const move=
        speed*.85;


    for(const car of traffic){

        car.position.z+=move;

        /* reset traffic */

        if(car.position.z>25){

            car.position.z=
                -250-Math.random()*350;

            const lanes=[
                -4.2,
                0,
                4.2
            ];

            car.position.x=
                lanes[
                    Math.floor(
                        Math.random()*3
                    )
                ];
        }
    }


    /* COINS */

    for(const coin of coins){

        coin.position.z+=move;

        coin.rotation.y+=.09;

        coin.rotation.x+=.03;

        if(coin.position.z>25){

            coin.position.z=
                -150-Math.random()*400;

            const lanes=[
                -4.2,
                0,
                4.2
            ];

            coin.position.x=
                lanes[
                    Math.floor(
                        Math.random()*3
                    )
                ];
        }
    }


    /* ROAD DASHES */

    for(const dash of roadLines){

        dash.position.z+=move;

        if(dash.position.z>20){

            dash.position.z-=520;
        }
    }


    /* TREES */

    for(const tree of scenery){

        tree.position.z+=move;

        if(tree.position.z>30){

            tree.position.z-=520;
        }
    }


    /* DISTANCE */

    if(speed>0){

        distance+=speed*.15;
    }


    /* LEVEL */

    level=
        Math.min(
            60,
            1+
            Math.floor(
                distance/600
            )
        );


    document
    .getElementById("level")
    .textContent=
    level;


    /* SPEED DISPLAY */

    document
    .getElementById("speed")
    .textContent=
    Math.round(
        Math.max(0,speed*15)
    );


    /* NITRO DISPLAY */

    document
    .getElementById("nitroFill")
    .style.width=
        nitroPower+"%";


    /* CAMERA */

    camera.position.x+=
        (player.position.x-camera.position.x)
        *.08;

    camera.position.y=
        4.1+
        Math.min(
            speed*.025,
            .25
        );

    camera.position.z=9;

    camera.lookAt(
        player.position.x,
        1,
        -15
    );


    collision();
}


/* =========================================
   START
========================================= */

document
.getElementById("startBtn")
.addEventListener(
    "click",
    ()=>{

        running=true;

        document
        .getElementById("startScreen")
        .style.display="none";

    }
);


/* =========================================
   PAUSE
========================================= */

document
.getElementById("pause")
.addEventListener(
    "click",
    ()=>{

        if(!running)
            return;

        paused=true;

        document
        .getElementById("pauseScreen")
        .style.display="flex";
    }
);


document
.getElementById("resume")
.addEventListener(
    "click",
    ()=>{

        paused=false;

        document
        .getElementById("pauseScreen")
        .style.display="none";
    }
);


/* =========================================
   RESIZE
========================================= */

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect=
            innerWidth/innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );
    }
);


/* =========================================
   GAME LOOP
========================================= */

function animate(){

    requestAnimationFrame(
        animate
    );

    update();

    renderer.render(
        scene,
        camera
    );
}


animate();

</script>

</body>
</html>
